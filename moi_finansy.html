<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>Мои финансы</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#7b8497;--line:#edf0f5;--green:#20a66a;--red:#e65a66;--purple:#7867ed;--shadow:0 8px 28px #1d29400a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:auto;padding:20px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 20px}.brand{display:flex;gap:11px;align-items:center}.logo{width:43px;height:43px;border-radius:15px;background:#e4f7ec;color:#16824e;display:grid;place-items:center;font-size:22px}.eyebrow{font-size:12px;color:var(--muted)}h1{font-size:22px;margin:0;letter-spacing:-.5px}.month{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;color:#485166}.balance{padding:22px;border-radius:24px;color:white;background:linear-gradient(135deg,#292b50,#5750a6);box-shadow:0 12px 30px #3c367022}.balance .label{color:#d9d9f3;font-size:13px}.balance .amount{font-size:34px;font-weight:750;letter-spacing:-1px;margin:5px 0 18px}.balance-bottom{display:flex;gap:20px}.bal-stat{flex:1;border-top:1px solid #ffffff30;padding-top:12px}.bal-stat small{display:block;color:#d9d9f3;margin-bottom:4px}.bal-stat b{font-size:16px}.pos{color:#c4f5d6}.neg{color:#ffd0d4}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0 23px}.action{padding:14px;border-radius:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}.action.income{background:#e5f8ed;color:#16824e}.action.expense{background:#ffeaec;color:#c43c4a}.section-head{display:flex;align-items:center;justify-content:space-between;margin:23px 0 13px}.section-head h2{font-size:17px;margin:0}.link{background:none;color:var(--purple);font-weight:650;padding:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid #eff1f6;border-radius:19px;padding:16px;box-shadow:var(--shadow);min-width:0}.catline{display:flex;align-items:center;gap:10px}.cat-icon{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex-shrink:0}.card .big{font-size:20px;font-weight:750;margin-top:13px;letter-spacing:-.4px}.muted{color:var(--muted);font-size:12px}.chart-card{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}.donut{width:142px;height:142px;position:relative}.donut svg{width:100%;height:100%;transform:rotate(-90deg)}.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.donut-center b{font-size:17px}.legend{display:flex;flex-direction:column;gap:10px}.legend-row{display:grid;grid-template-columns:9px 1fr auto;align-items:center;gap:7px;font-size:12px}.dot{width:8px;height:8px;border-radius:50%}.legend-row b{font-size:12px}.bars{height:135px;display:flex;align-items:end;justify-content:space-around;gap:10px;padding:12px 4px 0;border-bottom:1px solid var(--line)}.bar-group{height:100%;display:flex;align-items:end;gap:4px;position:relative;padding-bottom:0;flex:1;justify-content:center}.bar{width:13px;max-width:40%;border-radius:6px 6px 2px 2px;min-height:3px}.bar-labels{display:flex;justify-content:space-around;color:var(--muted);font-size:11px;margin-top:8px}.tabs{display:flex;background:#eceef5;border-radius:12px;padding:4px;gap:3px}.tabs button{flex:1;padding:8px 5px;border-radius:9px;background:transparent;color:#777f91;font-size:13px}.tabs button.active{background:white;color:#222b40;box-shadow:0 2px 7px #202b4010}.transactions{display:flex;flex-direction:column}.tx{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.tx:last-child{border-bottom:0}.tx-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex-shrink:0}.tx-info{flex:1;min-width:0}.tx-info b{display:block;font-size:14px}.tx-info small{color:var(--muted);font-size:12px}.tx-amount{text-align:right;font-weight:750;white-space:nowrap}.tx-amount.in{color:var(--green)}.tx-amount.out{color:var(--ink)}.tx-tools{display:flex;gap:4px;margin-left:3px}.tiny{background:#f1f2f7;color:#687087;border-radius:8px;padding:6px;font-size:12px}.empty{text-align:center;padding:28px 10px;color:var(--muted)}.bottom-note{text-align:center;color:#9299a8;font-size:11px;margin-top:24px}.modal-wrap{position:fixed;inset:0;background:#11182770;display:none;align-items:end;justify-content:center;padding:12px;z-index:5}.modal-wrap.show{display:flex}.modal{background:white;border-radius:24px 24px 20px 20px;padding:22px;width:min(100%,520px);max-height:92vh;overflow:auto;box-shadow:0 20px 60px #0002}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modal-head h2{margin:0;font-size:20px}.close{background:#f0f1f6;border-radius:10px;padding:8px 11px}.field{margin:13px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border:1px solid #e3e6ef;border-radius:12px;background:#fff;color:var(--ink);outline-color:#8980f5}.type-toggle{display:grid;grid-template-columns:1fr 1fr;background:#f0f1f6;padding:4px;border-radius:12px}.type-toggle button{padding:11px;border-radius:9px;background:transparent;color:#6c7486}.type-toggle button.active[data-type=expense]{background:#ffe6e9;color:#c43c4a}.type-toggle button.active[data-type=income]{background:#dcf7e6;color:#16824e}.submit{width:100%;padding:14px;border-radius:13px;background:#6258d9;color:white;font-weight:750;margin-top:8px}.danger{color:#c43c4a;background:#fff0f1}.filter-row{display:flex;gap:8px;align-items:center}.filter-row select{border:1px solid var(--line);border-radius:10px;background:white;padding:8px;color:#4b5568;max-width:50%}.hidden{display:none!important}
@media(min-width:600px){.app{padding-top:28px}.modal-wrap{align-items:center}.modal{border-radius:24px}.balance .amount{font-size:40px}.chart-card{grid-template-columns:170px 1fr}.donut{width:158px;height:158px}}
@media(max-width:380px){.chart-card{grid-template-columns:115px 1fr;padding:12px}.donut{width:112px;height:112px}.legend{gap:7px}.legend-row{font-size:11px}.balance{padding:18px}.balance .amount{font-size:29px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">◈</div><div><div class="eyebrow">ЛИЧНЫЙ БЮДЖЕТ</div><h1>Мои финансы</h1></div></div>
    <select class="month" id="monthSelect" aria-label="Месяц"></select>
  </header>
  <section class="balance">
    <div class="label">Баланс за выбранный месяц</div><div class="amount" id="balance">0 ₽</div>
    <div class="balance-bottom"><div class="bal-stat"><small>↗ Доходы</small><b class="pos" id="incomeTotal">0 ₽</b></div><div class="bal-stat"><small>↘ Расходы</small><b class="neg" id="expenseTotal">0 ₽</b></div></div>
  </section>
  <div class="actions"><button class="action income" id="addIncome">＋ Добавить доход</button><button class="action expense" id="addExpense">－ Добавить расход</button></div>
  <div class="section-head"><h2>Расходы по категориям</h2><button class="link" id="allCats">Все операции →</button></div>
  <section class="card chart-card"><div class="donut" id="donut"></div><div class="legend" id="legend"></div></section>
  <div class="section-head"><h2>Динамика</h2><div class="tabs" id="chartTabs"><button class="active" data-period="6">6 мес.</button><button data-period="12">12 мес.</button></div></div>
  <section class="card"><div class="bars" id="bars"></div><div class="bar-labels" id="barLabels"></div><div class="muted" style="margin-top:12px">🟢 Доходы &nbsp; 🔴 Расходы</div></section>
  <div class="section-head"><h2>Последние операции</h2><button class="link" id="showAll">История →</button></div>
  <section class="card"><div class="filter-row" style="margin-bottom:5px"><select id="filterType"><option value="all">Все операции</option><option value="expense">Расходы</option><option value="income">Доходы</option></select><select id="filterCat"><option value="all">Все категории</option></select></div><div class="transactions" id="transactions"></div></section>
  <div class="bottom-note">Данные хранятся в этом браузере на устройстве · ₽</div>
</div>
<div class="modal-wrap" id="modalWrap"><form class="modal" id="txForm"><div class="modal-head"><h2 id="modalTitle">Новая операция</h2><button type="button" class="close" id="closeModal">✕</button></div><div class="type-toggle"><button type="button" data-type="expense" class="active">Расход</button><button type="button" data-type="income">Доход</button></div><div class="field"><label for="amount">Сумма, ₽</label><input id="amount" type="number" min="1" step="1" placeholder="Например, 1250" required></div><div class="field"><label for="category">Категория</label><select id="category"></select></div><div class="field"><label for="note">Комментарий (необязательно)</label><input id="note" maxlength="100" placeholder="Например, продукты на неделю"></div><div class="field"><label for="date">Дата</label><input id="date" type="date" required></div><button class="submit" type="submit" id="saveBtn">Сохранить операцию</button><button class="submit danger hidden" type="button" id="deleteBtn">Удалить операцию</button></form></div>
<script>
const cats={
 expense:[['Еда','🍎','#f59e0b','#fff3d7'],['Жильё','🏠','#8b5cf6','#f0eaff'],['Транспорт','🚗','#3b82f6','#e6f0ff'],['Покупки','🛍️','#ec4899','#ffe8f3'],['Здоровье','💊','#14b8a6','#ddf8f3'],['Развлечения','🎬','#f97316','#ffeadf'],['Связь','📱','#64748b','#edf0f5'],['Другое','📦','#94a3b8','#f0f2f5']],
 income:[['Зарплата','💼','#20a66a','#e1f7e9'],['Подработка','✨','#0d9488','#dcf8f1'],['Подарок','🎁','#8b5cf6','#f0eaff'],['Перевод','💸','#3b82f6','#e6f0ff'],['Другое','💰','#94a3b8','#f0f2f5']]
};
const colors=['#f59e0b','#8b5cf6','#3b82f6','#ec4899','#14b8a6','#f97316','#64748b','#94a3b8'];
const $=id=>document.getElementById(id);
let txs=[], selectedType='expense', editId=null, chartPeriod=6, showAll=false, monthKey='';
const money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n))+' ₽';
const isoNow=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const monthOf=d=>d.slice(0,7);
const monthName=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})};
const catInfo=(type,name)=>cats[type].find(c=>c[0]===name)||[name,'💳','#94a3b8','#f0f2f5'];
function load(){try{txs=JSON.parse(localStorage.getItem('my-finance-txs-v1')||'[]')}catch{txs=[]}
 if(!txs.length){const d=new Date();const mk=(delta,day)=>{let x=new Date(d.getFullYear(),d.getMonth()+delta,day);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
 txs=[
 {id:1,type:'income',amount:85000,category:'Зарплата',note:'Зарплата',date:mk(0,2)},
 {id:2,type:'expense',amount:1240,category:'Еда',note:'Продукты',date:mk(0,3)},
 {id:3,type:'expense',amount:8500,category:'Жильё',note:'Коммунальные услуги',date:mk(0,4)},
 {id:4,type:'expense',amount:760,category:'Транспорт',note:'Проездной',date:mk(0,6)},
 {id:5,type:'expense',amount:3400,category:'Покупки',note:'Покупки для дома',date:mk(0,8)},
 {id:6,type:'expense',amount:950,category:'Еда',note:'Кафе',date:mk(0,10)},
 {id:7,type:'income',amount:5000,category:'Подработка',note:'Дополнительный доход',date:mk(0,12)},
 {id:8,type:'expense',amount:1300,category:'Развлечения',note:'Кино',date:mk(0,14)},
 {id:9,type:'expense',amount:450,category:'Связь',note:'Мобильная связь',date:mk(0,15)},
 {id:10,type:'expense',amount:2200,category:'Еда',note:'Продукты',date:mk(0,17)}
 ];save()}
}
function save(){localStorage.setItem('my-finance-txs-v1',JSON.stringify(txs))}
function initMonths(){let opts='';const d=new Date();for(let i=0;i<18;i++){const x=new Date(d.getFullYear(),d.getMonth()-i,1),k=`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`;opts+=`<option value="${k}">${monthName(k)}</option>`} $('monthSelect').innerHTML=opts;monthKey=opts?$('monthSelect').value:''}
function render(){
 const list=txs.filter(t=>monthOf(t.date)===monthKey),inc=list.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),out=list.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
 $('balance').textContent=money(inc-out);$('incomeTotal').textContent=money(inc);$('expenseTotal').textContent=money(out);
 renderDonut(list);renderBars();renderTx();
}
function renderDonut(list){
 const totals={};list.filter(t=>t.type==='expense').forEach(t=>totals[t.category]=(totals[t.category]||0)+t.amount);
 const arr=Object.entries(totals).sort((a,b)=>b[1]-a[1]),sum=arr.reduce((s,x)=>s+x[1],0);let circle='',offset=0;
 if(sum){arr.forEach(([name,val],i)=>{const len=val/sum*100;circle+=`<circle cx="60" cy="60" r="43" fill="none" stroke="${catInfo('expense',name)[2]}" stroke-width="16" stroke-dasharray="${len*2.7018} ${270.18-len*2.7018}" stroke-dashoffset="${-offset*2.7018}"/>`;offset+=len})}else circle='<circle cx="60" cy="60" r="43" fill="none" stroke="#edf0f5" stroke-width="16"/>';
 $('donut').innerHTML=`<svg viewBox="0 0 120 120">${circle}</svg><div class="donut-center"><b>${money(sum)}</b><span class="muted">расходы</span></div>`;
 $('legend').innerHTML=arr.length?arr.slice(0,5).map(([n,v])=>`<div class="legend-row"><span class="dot" style="background:${catInfo('expense',n)[2]}"></span><span>${catInfo('expense',n)[1]} ${n}</span><b>${Math.round(v/sum*100)}%</b></div>`).join(''):'<div class="muted">Пока нет расходов</div>';
}
function renderBars(){const now=new Date(),months=[];for(let i=chartPeriod-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;months.push({k,label:d.toLocaleDateString('ru-RU',{month:'short'}).replace('.','')})}
 const vals=months.map(m=>{const a=txs.filter(t=>monthOf(t.date)===m.k);return {i:a.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),o:a.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0)}}),max=Math.max(1,...vals.flatMap(v=>[v.i,v.o]));
 $('bars').innerHTML=vals.map(v=>`<div class="bar-group"><div class="bar" title="Доходы ${money(v.i)}" style="height:${Math.max(v.i?3:0,v.i/max*100)}%;background:#35b779"></div><div class="bar" title="Расходы ${money(v.o)}" style="height:${Math.max(v.o?3:0,v.o/max*100)}%;background:#ef6a74"></div></div>`).join('');
 $('barLabels').innerHTML=months.map(m=>`<span>${m.label}</span>`).join('');
}
function fillCats(){const opts=cats[selectedType].map(c=>`<option value="${c[0]}">${c[1]} ${c[0]}</option>`).join('');$('category').innerHTML=opts}
function renderTx(){const type=$('filterType').value,cat=$('filterCat').value;const list=txs.filter(t=>monthOf(t.date)===monthKey&&(type==='all'||t.type===type)&&(cat==='all'||t.category===cat)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);const shown=showAll?list:list.slice(0,5);
 $('transactions').innerHTML=shown.length?shown.map(t=>{const c=catInfo(t.type,t.category);return `<div class="tx"><div class="tx-icon" style="background:${c[3]}">${c[1]}</div><div class="tx-info"><b>${esc(t.note||t.category)}</b><small>${esc(t.category)} · ${new Date(t.date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</small></div><div class="tx-amount ${t.type==='income'?'in':'out'}">${t.type==='income'?'+':'−'}${money(t.amount)}</div><div class="tx-tools"><button class="tiny" onclick="editTx(${t.id})" aria-label="Изменить">✎</button></div></div>`}).join(''):'<div class="empty">В этом месяце пока нет операций.<br>Добавь первую запись выше.</div>';
 const fc=new Set(txs.filter(t=>monthOf(t.date)===monthKey).map(t=>t.category));$('filterCat').innerHTML='<option value="all">Все категории</option>'+[...fc].map(c=>`<option ${c===cat?'selected':''}>${esc(c)}</option>`).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openModal(type='expense',t=null){selectedType=t?t.type:type;editId=t?t.id:null;$('modalTitle').textContent=t?'Изменить операцию':'Новая операция';document.querySelectorAll('.type-toggle button').forEach(b=>b.classList.toggle('active',b.dataset.type===selectedType));fillCats();$('amount').value=t?t.amount:'';$('category').value=t?t.category:cats[selectedType][0][0];$('note').value=t?t.note:'';$('date').value=t?t.date:isoNow();$('deleteBtn').classList.toggle('hidden',!t);$('saveBtn').textContent=t?'Сохранить изменения':'Сохранить операцию';$('modalWrap').classList.add('show');setTimeout(()=>$('amount').focus(),150)}
function editTx(id){const t=txs.find(x=>x.id===id);if(t)openModal(t.type,t)}
function closeModal(){$('modalWrap').classList.remove('show')}
$('addIncome').onclick=()=>openModal('income');$('addExpense').onclick=()=>openModal('expense');$('closeModal').onclick=closeModal;$('modalWrap').onclick=e=>{if(e.target===$('modalWrap'))closeModal()};
document.querySelectorAll('.type-toggle button').forEach(b=>b.onclick=()=>{selectedType=b.dataset.type;document.querySelectorAll('.type-toggle button').forEach(x=>x.classList.toggle('active',x===b));fillCats()});
$('txForm').onsubmit=e=>{e.preventDefault();const amount=Number($('amount').value);if(!Number.isFinite(amount)||amount<=0)return;const item={id:editId||Date.now(),type:selectedType,amount,category:$('category').value,note:$('note').value.trim(),date:$('date').value};if(editId)txs=txs.map(t=>t.id===editId?item:t);else txs.push(item);save();monthKey=monthOf(item.date);$('monthSelect').value=monthKey;if(!$('monthSelect').value){initMonths();$('monthSelect').value=monthKey}closeModal();render()};
$('deleteBtn').onclick=()=>{if(editId&&confirm('Удалить эту операцию?')){txs=txs.filter(t=>t.id!==editId);save();closeModal();render()}};
$('monthSelect').onchange=()=>{monthKey=$('monthSelect').value;showAll=false;render()};$('filterType').onchange=renderTx;$('filterCat').onchange=renderTx;
$('showAll').onclick=$('allCats').onclick=()=>{showAll=!showAll;$('showAll').textContent=showAll?'Свернуть ↑':'История →';renderTx();$('transactions').scrollIntoView({behavior:'smooth',block:'center'})};
$('chartTabs').onclick=e=>{const b=e.target.closest('button[data-period]');if(!b)return;chartPeriod=Number(b.dataset.period);document.querySelectorAll('#chartTabs button').forEach(x=>x.classList.toggle('active',x===b));renderBars()};
load();initMonths();render();
</script>
</body></html>
